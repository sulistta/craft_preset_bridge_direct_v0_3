[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "craft-preset-bridge"
version = "0.36.0"
description = "Conversão local e verificável de presets Adobe para FilmCraft e EffectCraft"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["defusedxml==0.7.1", "pydantic==2.12.3", "jsonschema==4.25.1"]

[project.optional-dependencies]
gui = ["PySide6==6.9.3"]
dev = ["pytest==9.0.3", "ruff==0.14.0", "mypy==1.18.2", "types-defusedxml==0.7.0.20250822", "types-jsonschema==4.25.1.20250822", "build==1.3.0"]
build = ["pyinstaller==6.16.0"]

[project.scripts]
craft-bridge = "craft_bridge.cli.main:main"
craft-bridge-gui = "craft_bridge.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/craft_bridge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "scripts/", ".github/", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "AGENTS.md", "CHANGELOG.md", "pyproject.toml", "uv.lock"]
exclude = ["**/__pycache__", "**/*.pyc", "**/target", "**/*.spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: amostras reais locais não redistribuídas", "gui: testes Qt opcionais"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/craft_bridge"]
check_untyped_defs = true
warn_unused_ignores = true
