[package]
name = "craft-bridge-multi-input-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
effectcraft-engine = { path = "../../../artifacts/effectcraft-multi-input/crates/engine" }
effectcraft-plugin = { path = "../../../artifacts/effectcraft-multi-input/crates/plugin", features = ["wasm"] }
effectcraft-render = { path = "../../../artifacts/effectcraft-multi-input/crates/render" }
effectcraft-time = { path = "../../../artifacts/effectcraft-multi-input/crates/time" }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.effectcraft-effects]
opt-level = 3

[profile.dev.package.effectcraft-raster]
opt-level = 3

[profile.dev.package.effectcraft-render]
opt-level = 3

[profile.dev.package.effectcraft-track]
opt-level = 3

[profile.dev.package.effectcraft-path]
opt-level = 3

[profile.dev.package.wasmi]
opt-level = 3
